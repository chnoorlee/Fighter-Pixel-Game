<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2031">
<title>Dusk Patrol — Lake Country</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{color-scheme:dark;--ink:#1c2030;--edge:#494857;--cream:#fff3d4;--honey:#ffc47a;--dim:#b4b1b7;font-family:'IBM Plex Mono','Courier New',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--honey);outline-offset:4px}
#deck{height:100vh;height:100dvh;display:flex;flex-direction:column}
#sky{position:relative;min-height:0;flex:1;overflow:hidden;isolation:isolate;background:#9e89a1;touch-action:none}
.screen{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#glass{pointer-events:none}
header{position:absolute;left:clamp(16px,3vw,48px);top:clamp(18px,3.8vh,42px);display:flex;align-items:center;gap:14px;pointer-events:none;user-select:none}
.patch{width:54px;height:54px;image-rendering:pixelated}
h1{font:700 34px/1 'Silkscreen',monospace;margin:0;color:#ffedca;text-shadow:3px 0 #383043,0 3px #383043,3px 3px #383043,5px 5px #383043;white-space:nowrap}
#wordmark{display:block;width:256px;height:32px;image-rendering:pixelated}h1 .google-title{display:none}.font-ready #wordmark{display:none}.font-ready .google-title{display:block}
.region{font-size:10px;line-height:1;font-weight:600;display:flex;align-items:center;gap:9px;margin-top:8px;color:#fff3d7;text-shadow:1px 1px #514052,0 1px 4px #38283c;white-space:nowrap}
.region i{display:block;width:17px;height:3px;background:#ffcb78;box-shadow:1px 1px #594356}
.sound,.mode,.touch button{border:1px solid #a19a9c;background:#222233e8;box-shadow:2px 2px 0 #24213277;color:var(--cream);height:33px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:10px;font-weight:600}
.sound{position:absolute;right:clamp(16px,3vw,48px);top:clamp(20px,4vh,44px);padding:0 12px}.sound[aria-pressed=true]{color:var(--honey)}
button:hover{border-color:var(--honey);background-color:#373344}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:miter;stroke-linecap:square}
.mute-slash{display:none}.sound[aria-pressed=false] .mute-slash{display:block}.sound[aria-pressed=false] .wave{display:none}
.mode{position:absolute;bottom:21px;left:clamp(16px,3vw,48px);height:35px;border-color:#8b808a;padding:0 11px;gap:9px}
.segments{display:flex;gap:3px;align-items:center;padding-left:8px;border-left:1px solid #595564;height:16px}.segments i{background:#646173;width:8px;height:3px}.segments i.active{background:var(--honey)}
.telemetry{position:absolute;right:clamp(16px,3vw,48px);bottom:21px;display:flex;gap:20px;align-items:center;color:#fff6df;text-shadow:1px 1px #342c40,0 1px 4px #302539;font-size:11px;font-weight:600;pointer-events:none}.telemetry span{white-space:nowrap}.telemetry small{font-size:9px;color:#fff0d3}.telemetry b{font-size:15px}
.in-cockpit .telemetry{display:none}.in-cockpit .mode{bottom:auto;top:clamp(64px,11vh,102px);right:clamp(16px,3vw,48px);left:auto}
footer{position:relative;flex:none;min-height:57px;background:#1c202c;border-top:2px solid #3c3d49;display:flex;align-items:center;justify-content:space-between;gap:13px;padding:9px clamp(16px,3vw,48px);user-select:none}
.hints{display:flex;align-items:center;column-gap:clamp(11px,2vw,34px);row-gap:5px}.hint{display:flex;gap:7px;align-items:center;font-size:11px;font-weight:500;color:#d3cfd2;white-space:nowrap}.hint .icon{width:14px;height:17px;color:#ede4d2}kbd{font:600 10px/15px 'IBM Plex Mono',monospace;padding:0 4px;color:#eee3cd;background:#30333f;border:1px solid #5e5d68;border-bottom-width:2px;min-width:17px;text-align:center}
.payload{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:500;color:#bcb7ba;white-space:nowrap}.payload b{font-size:12px;color:var(--honey)}
.rails{display:flex;gap:3px;align-items:center}.rail{width:6px;height:16px;display:block;background:#f3bb75;clip-path:polygon(33% 0,67% 0,67% 13%,83% 13%,83% 63%,100% 75%,100% 94%,67% 86%,67% 100%,33% 100%,33% 86%,0 94%,0 75%,17% 63%,17% 13%,33% 13%)}.rail.empty{background:#575361}
.touch{display:none;position:absolute;right:15px;bottom:62px;gap:7px}.touch button{height:40px;min-width:50px;touch-action:none}.touch button.held{color:var(--honey);border-color:var(--honey)}.touchhint{display:none}
#failure{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:var(--ink);padding:20px;max-width:90%;text-align:center}
@media(max-width:820px){.hints{gap:12px}.hint{gap:4px}.payload{gap:6px}footer{padding-inline:16px}.patch{width:44px;height:44px}header{gap:10px}h1{font-size:29px}#wordmark{width:224px;height:28px}}
@media(pointer:coarse){.touch{display:flex}.hints{display:none}.touchhint{display:block;font-size:11px;color:#d3cfd2}}
@media(max-width:680px){.patch{width:37px;height:37px}h1{font-size:21px}#wordmark{width:160px;height:20px}.region{font-size:8px;gap:6px;margin-top:6px}header{left:14px;top:18px;gap:8px}.sound{right:13px;top:19px;padding:0 7px;gap:5px;font-size:9px;height:28px}.hints{flex-wrap:wrap;max-width:75%;gap:5px 12px}.hint{font-size:9px}.payload>span:first-child{display:none}.telemetry{gap:8px;right:15px}.mode{left:14px}.touch{bottom:65px}.in-cockpit .touch{bottom:auto;top:110px}.in-cockpit .telemetry{display:none}footer{min-height:48px}}
@media(max-height:430px){header{top:10px;transform:scale(.8);transform-origin:top left}.sound{top:10px}.mode,.telemetry{bottom:9px}footer{min-height:35px;padding-block:4px}.touch{bottom:47px}.in-cockpit .touch{top:55px;bottom:auto;right:170px}}
@media(pointer:coarse) and (min-height:431px){.in-cockpit .mode{top:65px}.in-cockpit .touch{top:113px;bottom:auto}}
@media(max-width:360px){.region{font-size:7px}.sound{gap:3px}.patch{width:30px;height:30px}h1{font-size:17px}}
.tools{position:absolute;right:clamp(16px,3vw,48px);top:clamp(20px,4vh,44px);display:flex;align-items:center;gap:6px}
.tools .sound{position:static}.tools #settingsOpen{width:33px;padding:0}
#settingsDialog{width:min(320px,calc(100vw - 32px));max-height:calc(100dvh - 24px);color:var(--cream);background:#222533;border:1px solid #a19a9c;border-top:3px solid var(--honey);padding:22px;box-shadow:5px 5px 0 #17182590}
#settingsDialog::backdrop{background:#17182583}
#settingsDialog h2{font-size:19px;margin:0 0 18px}
#settingsDialog fieldset{padding:0;margin:0;border:0;display:flex}
#settingsDialog legend{font-size:12px;color:#d8ced1;margin-bottom:7px}
#settingsDialog label{position:relative;flex:1;cursor:pointer}
#settingsDialog label span{height:44px;display:grid;place-items:center;border:1px solid #74717b;font-size:13px;background:#2a2d3b}
#settingsDialog input{position:absolute;opacity:0}
#settingsDialog input:checked+span{color:#201f29;border-color:#efbc7a;background:#efbc7a;font-weight:600}
#settingsDialog input:focus-visible+span{outline:2px solid var(--cream);outline-offset:-5px}
#settingsClose{border:1px solid #87808a;background:#333441;padding:9px 14px;margin-top:20px;width:100%;min-height:42px;font-size:12px}
html[lang="zh-CN"] #wordmark{display:none}html[lang="zh-CN"] h1 .google-title{display:block;font-family:'Microsoft YaHei',sans-serif;font-size:.94em}
@media(pointer:coarse){.tools button,.touch button,.mode{min-height:44px}.tools #settingsOpen{min-width:44px}}
@media(max-width:680px){.tools{right:13px;top:16px}.tools #settingsOpen{width:28px}}
@media(max-width:410px){.tools .sound#sound{width:31px;min-width:31px}.tools #sound span{display:none}}
@media(max-width:360px){.tools{right:8px}.tools #settingsOpen{min-width:32px}.tools{gap:4px}}
@media(max-height:430px){.tools{top:10px}}
</style>

<body>
<main id="deck">
<section id="sky" aria-label="Flight area" data-zh-label="飞行区域">
<canvas class="screen" id="world" aria-label="Dusk Patrol flight simulation" data-zh-label="暮光巡航飞行模拟"></canvas>
<canvas class="screen" id="glass" aria-hidden="true"></canvas>
<header><canvas class="patch" id="patch" width="40" height="40" aria-hidden="true"></canvas><div><h1 aria-label="Dusk Patrol" data-zh-label="暮光巡航"><canvas id="wordmark" width="64" height="8" aria-hidden="true"></canvas><span class="google-title" data-zh="暮光巡航">Dusk Patrol</span></h1><div class="region"><i></i><span data-zh="湖区 / 自由飞行">LAKE COUNTRY &nbsp;/&nbsp; FREE FLIGHT</span></div></div></header>
<div class="tools"><button type="button" class="sound" id="sound" title="Toggle synthesized sound" data-zh-title="切换合成音效" aria-pressed="false"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h4l4-4v12l-4-4H3z"/><path class="wave" d="M14 7q3 3 0 6m2-9q6 6 0 12"/><path class="mute-slash" d="m14 8 4 4m0-4-4 4"/></svg><span>SOUND OFF</span></button>
<button type="button" id="settingsOpen" class="sound" title="Settings" data-zh-title="设置" aria-label="Settings" data-zh-label="设置" aria-haspopup="dialog" aria-controls="settingsDialog"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9m4 0h3M4 12h2m4 0h10M4 18h7m4 0h5"/><path d="M13 4h4v4h-4zm-7 6h4v4H6zm5 6h4v4h-4z"/></svg></button></div>
<button type="button" class="mode" id="view" title="Cycle camera (Space)" data-zh-title="切换视角（空格）" aria-label="Cycle camera. Current view Chase"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7V4h4m8 0h4v3m0 6v3h-4M6 16H2v-3m3-3h3l2-3 2 3h3"/></svg><span id="viewLabel">CHASE CAM</span><span class="segments" aria-hidden="true"><i></i><i class="active"></i><i></i></span></button>
<div class="telemetry" aria-label="Flight telemetry" data-zh-label="飞行数据"><span title="Indicated airspeed in knots" data-zh-title="指示空速（节）"><small>IAS</small> <b id="spd">087</b> KT</span><span title="Altitude in feet" data-zh-title="海拔高度（英尺）"><small>ALT</small> <b id="alt">476</b> FT</span></div>
<div class="touch"><button id="touchRoll" title="Barrel roll" data-zh-title="桶滚" data-zh="桶滚">ROLL</button><button id="touchBoost" title="Hold for afterburner" data-zh-title="按住开启加力" data-zh="加力">BOOST</button><button id="touchFire" title="Fire missile" data-zh-title="发射导弹" data-zh="发射">FIRE</button></div>
<div id="failure" role="alert"></div>
</section>
<footer aria-label="Flight controls and missile inventory" data-zh-label="飞行操控与导弹余量"><div class="hints">
<span class="hint"><svg class="icon" viewBox="0 0 16 20" aria-hidden="true"><path d="M5 2h6l3 3v10l-3 3H5l-3-3V5zM8 2v6"/></svg><span data-zh="操纵">Steer</span></span>
<span class="hint"><kbd data-zh="单击">CLICK</kbd><span data-zh="桶滚">Roll</span></span><span class="hint"><kbd data-zh="按住">HOLD</kbd><span data-zh="加力">Afterburner</span></span>
<span class="hint"><kbd>F</kbd><span aria-hidden="true">/</span><kbd data-zh="右键">RMB</kbd><span data-zh="发射">Fire</span></span><span class="hint"><kbd data-zh="空格">SPACE</kbd><span data-zh="视角">View</span></span>
</div><div class="touchhint" data-zh="滑动操纵飞机">Drag to steer</div><div class="payload" id="payload" aria-label="Four missiles available"><span data-zh="导弹">MISSILES</span><span class="rails" aria-hidden="true"><i class="rail"></i><i class="rail"></i><i class="rail"></i><i class="rail"></i></span><b id="count">04</b></div></footer>
</main>
<dialog id="settingsDialog" aria-labelledby="settingsTitle">
<h2 id="settingsTitle" data-zh="设置">Settings</h2>
<fieldset><legend data-zh="界面语言">Language</legend><label><input type="radio" id="langEn" name="language" value="en"><span lang="en">English</span></label><label><input type="radio" id="langZh" name="language" value="zh"><span lang="zh-CN">简体中文</span></label></fieldset>
<button type="button" id="settingsClose" data-zh="继续飞行">Resume flight</button>
</dialog>
<script>
'use strict';
// The terrain repeats at the far side of a 6 km map. Every height query uses
// the same triangular interpolation as the visible mesh.
class Landscape {
  constructor(gl) {
    this.gl=gl;
    this.period=6144; this.tileSize=512; this.step=16; this.tiles=new Map();
    this.noise=this.makeNoise();
    this.skyTexture=this.paintSky();
    this.empty=gl.createVertexArray();
    this.makePrograms();
    this.forestMeshes=[this.makeTree(false),this.makeTree(true)];
  }
  makeTree(pine) {
    const gl=this.gl,vertices=[];
    const stack=(rings,sides,foliage,phase=0)=>{
      for(let j=0;j<rings.length-1;j++)for(let i=0;i<sides;i++){
        const point=(idx,level)=>{
          const r=rings[level],a=phase+idx/sides*2*Math.PI;
          const rad=r[1]*(pine?1:1+.20*Math.sin(idx*4.3+level));
          return [Math.cos(a)*rad,r[0]+(pine?0:r[1]*.23*Math.sin(idx*2+level)),Math.sin(a)*rad];
        };
        const a=point(i,j),b=point(i+1,j),c=point(i+1,j+1),d=point(i,j+1);
        const normalAngle=phase+(i+.5)/sides*2*Math.PI;
        const shade=Math.cos(normalAngle-.42)*.95+(j/(rings.length-1)-.3)*.46;
        for(const v of [a,b,c,a,c,d])vertices.push(...v,shade,foliage);
      }
    };
    stack([[0,.052],[.44,.033]],4,0);
    if(pine) {
      stack([[.17,.255],[.69,0]],5,1);
      stack([[.39,.222],[.85,0]],5,1,.12);
      stack([[.58,.157],[1.04,0]],5,1);
    }else{
      stack([[.22,.10],[.37,.35],[.62,.37],[.84,.255],[1.,.045]],7,1);
    }
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
    return {buf,count:vertices.length/5};
  }
  makeTile(ix,iz) {
    const gl=this.gl,side=this.tileSize,step=this.step,grid=side/step;
    const bx=ix*side,bz=iz*side,points=[];
    for(let z=0;z<=grid;z++)for(let x=0;x<=grid;x++){
      const dx=x*step,dz=z*step;points.push([dx,this.raw(bx+dx,bz+dz),dz]);
    }
    const mesh=[],groups=[[],[]];
    const emit=(poly,color,wet)=>{
      for(let i=1;i<poly.length-1;i++)for(const p of [poly[0],poly[i],poly[i+1]]){
        mesh.push(p[0],wet===1?0:p[1],p[2],color,p[1],wet);
      }
    };
    const clip=(tri,keepWet)=>{
      let p=tri[2],inP=keepWet?p[1]<0:p[1]>=0;const result=[];
      for(const q of tri){
        const inQ=keepWet?q[1]<0:q[1]>=0;
        if(inP!==inQ){
          const t=p[1]/(p[1]-q[1]);result.push([p[0]+(q[0]-p[0])*t,0,p[2]+(q[2]-p[2])*t]);
        }
        if(inQ)result.push(q);p=q;inP=inQ;
      }
      return result;
    };
    for(let z=0;z<grid;z++)for(let x=0;x<grid;x++){
      const i=z*(grid+1)+x,a=points[i],b=points[i+1],c=points[i+grid+1],d=points[i+grid+2];
      const biome=(this.n((bx+x*step)/96,(bz+z*step)/96,64)-.5)*.86-.12;
      for(const tri of [[a,b,d],[a,d,c]]){
        const [p,q,r]=tri;
        const firstHalf=q===b;
        const gx=(firstHalf?b[1]-a[1]:d[1]-c[1])/step;
        const gz=(firstHalf?d[1]-b[1]:c[1]-a[1])/step;
        const shade=-.48*gx-.60*gz+biome;
        if(Math.min(p[1],q[1],r[1])>=0)emit(tri,shade,0);
        else if(Math.max(p[1],q[1],r[1])<0)emit(tri,shade,1);
        else{emit(clip(tri,true),shade,1);emit(clip(tri,false),shade,0);}
      }
    }
    // Distant cloud decks occupy a small fraction of the valley.
    if(ix%3===0 && iz%3===2){
      const cloud=(dx,dz)=>[450+dx,78+10*Math.max(0,1-(dx/130)**2-(dz/52)**2),16+dz];
      for(let i=0;i<20;i++){
        const phase=i*Math.PI/10,next=(i+1)*Math.PI/10;
        const rim=t=>cloud(Math.cos(t)*130,Math.sin(t)*52);
        const inner=t=>cloud(Math.cos(t)*90,Math.sin(t)*35);
        emit([cloud(0,0),inner(phase),inner(next)],.88,2);
        emit([inner(phase),rim(phase),rim(next),inner(next)],Math.sin(phase+.3)*.65+.18,2);
      }
    }
    const density=23;
    for(let i=0;i<density*density;i++){
      const xx=i%density,zz=Math.floor(i/density),gx=ix*density+xx,gz=iz*density+zz;
      const rand=k=>this.hash(gx,gz,k);
      const x=side*(xx+.15+.7*rand(1))/density,z=side*(zz+.15+.7*rand(2))/density;
      const y=this.floor(bx+x,bz+z);
      const forest=this.n((bx+x)/96,(bz+z)/96,64);
      if(y<2.1 || rand(3)>.07+1.06*forest)continue;
      const patch=this.n((bx+x)/96+5.1,(bz+z)/96-9.7,64);
      const pine=patch>.59 || rand(4)<.16;
      const ht=(pine?21:15)*( .70+.63*rand(5))*( .85+.32*forest);
      const group=groups[pine?1:0];group.push(x,y-.32,z,ht,pine?-1:Math.min(.999,.72*patch+.57*rand(6)),rand(7)*.62);
      // A flattened silhouette grounds each tree in the raking evening light.
      const dx=ht*.49,dz=ht*.63,half=ht*.18;
      const flat=(a,b)=>[x+a,Math.max(.05,this.floor(bx+x+a,bz+z+b))+.24,z+b];
      emit([flat(-half*.42,0),flat(-dx-half,-dz*.69),flat(-dx,-dz),flat(-dx+half,-dz*.72),flat(half*.42,0)],-.14,3);
    }
    const attrib=(i,n,stride,off,div=0)=>{
      gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,n,gl.FLOAT,false,stride,off);
      gl.vertexAttribDivisor(i,div);
    };
    const upload=data=>{
      const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);return buf;
    };
    const vao=gl.createVertexArray();gl.bindVertexArray(vao);upload(mesh);attrib(0,3,24,0);attrib(1,3,24,12);
    const trees=groups.map((arr,t)=>{
      const vao=gl.createVertexArray();gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER,this.forestMeshes[t].buf);
      attrib(0,3,20,0);attrib(1,2,20,12);
      // Prefixes constitute an unbiased lower-density forest for distant tiles.
      for(let i=arr.length/6-1;i>0;i--){
        const j=Math.floor(this.hash(i,ix+iz*12,23)*(i+1));
        for(let c=0;c<6;c++){const h=arr[i*6+c];arr[i*6+c]=arr[j*6+c];arr[j*6+c]=h;}
      }
      upload(arr);attrib(2,4,24,0,1);attrib(3,2,24,16,1);return {vao,n:arr.length/6};
    });
    gl.bindVertexArray(null);return {vao,count:mesh.length/6,trees};
  }
  draw(cam,state,time) {
    const gl=this.gl,eye=cam.eye,side=this.tileSize;
    gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);gl.disable(gl.SCISSOR_TEST);
    gl.disable(gl.DEPTH_TEST);gl.depthMask(true);
    gl.clearDepth(1);gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.sky.p);gl.bindVertexArray(this.empty);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,this.skyTexture);
    const sky=this.sky.u;
    gl.uniform1i(sky.artwork,0);gl.uniform3fv(sky.fw,cam.forward);
    gl.uniform3fv(sky.rt,cam.right);gl.uniform3fv(sky.up,cam.up);
    gl.uniform2f(sky.scale,cam.aspect*cam.tan,cam.tan);gl.drawArrays(gl.TRIANGLES,0,3);
    gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
    const tiles=[],dist=2500,ix=Math.floor(eye[0]/side),iz=Math.floor(eye[2]/side);
    const far=cam.forward,across=cam.right,rise=cam.up,wide=cam.tan*cam.aspect,vert=cam.tan;
    for(let j=-5;j<=5;j++)for(let i=-5;i<=5;i++){
      const x=(ix+i)*side,z=(iz+j)*side,dx=x+side*.5-eye[0],dz=z+side*.5-eye[2];
      const horizontal=Math.hypot(dx,dz);if(horizontal>dist+310)continue;
      const dy=95-eye[1],depth=far[0]*dx+far[1]*dy+far[2]*dz;

    s.verticalSpeed=(s.y-oldY)/dt;s.g=follow(s.g,clamp(Math.hypot(1,s.speed*s.turnRate/9.81)+(s.verticalSpeed-oldVs)/dt/9.81,-1,9),3,dt);
    s.slip=clamp((turn-s.turnRate)*.8,-1,1);this.aircraft.update(dt,s,this.time);
  }
  camera(){
    const s=this.s,aspect=this.canvas.width/this.canvas.height,yaw=s.heading,sh=Math.sin(yaw),ch=Math.cos(yaw),cp=Math.cos(s.pitch),sp=Math.sin(s.pitch);
    const body=[sh*cp,sp,ch*cp],right=[ch,0,-sh],bodyUp=cross(body,right);
    let eye,forward,upRef,alpha=0,jetVisibility=1;
    let tan=.52+s.boost*.035;
    if(this.mode===0){eye=[s.x,s.y+Math.max(136,125/aspect),s.z];forward=[0,-1,0];upRef=[0,0,1];tan=.64}
    else if(this.mode===2){
      eye=[s.x+body[0]*5,s.y+2.9+body[1]*5,s.z+body[2]*5];forward=body;upRef=bodyUp.map((v,i)=>v*Math.cos(s.bank)+right[i]*Math.sin(s.bank));alpha=1;jetVisibility=0;
    }else{
      const behind=44+7*s.boost+Math.max(0,1/aspect-1)*19,side=13+3*Math.sin(this.time*.12),rise=19;
      eye=[s.x-sh*behind+ch*side,s.y+rise-sp*behind*.68,s.z-ch*behind-sh*side];
      eye[1]=Math.max(eye[1],this.world.height(eye[0],eye[2])+5);
      forward=norm([s.x+sh*28-eye[0],s.y+5+sp*25-eye[1],s.z+ch*28-eye[2]]);
      upRef=[ch*this.bank*.12,1,-sh*this.bank*.12];
    }
    let r=norm(cross(upRef,forward)),up=cross(forward,r);
    if(this.previous){
      let t=clamp((this.time-this.switched)/1.05,0,1);t=t*t*(3-2*t);const p=this.previous;
      eye=blend(p.offset.map((a,i)=>a+[s.x,s.y,s.z][i]),eye,t);
      // Rotate first about the previous viewing axis, then tilt toward the new direction.
      const turnAxis=cross(p.forward,forward),sn=Math.hypot(...turnAxis),cs=clamp(dot(p.forward,forward),-1,1);
      const axis=sn>.00001?turnAxis.map(n=>n/sn):p.up,angle=Math.atan2(sn,cs);
      const rot=(v,a,k)=>{const c=Math.cos(k),q=Math.sin(k),av=cross(a,v),d=dot(a,v);return v.map((n,i)=>n*c+av[i]*q+a[i]*d*(1-c))};
      const endR=rot(p.right,axis,angle),roll=Math.atan2(dot(cross(endR,r),forward),dot(endR,r));
      forward=norm(rot(p.forward,axis,angle*t));r=norm(rot(rot(p.right,axis,angle*t),forward,roll*t));up=cross(forward,r);
      tan=mix(p.tan,tan,t);alpha=mix(p.alpha,alpha,t);jetVisibility=mix(p.jetVisibility,jetVisibility,t);
      if(t===1)this.previous=null;
    }
    const n=.35,f=9000,q=(f+n)/(f-n),d=-2*n*f/(f-n),vp=new Float32Array(16);
    for(let i=0;i<3;i++){vp[i*4]=r[i]/tan/aspect;vp[i*4+1]=up[i]/tan;vp[i*4+2]=q*forward[i];vp[i*4+3]=forward[i]}
    vp[12]=-dot(r,eye)/tan/aspect;vp[13]=-dot(up,eye)/tan;vp[14]=-q*dot(forward,eye)+d;vp[15]=-dot(forward,eye);
    return {eye,forward,right:r,up,tan,aspect,vp,alpha,jetVisibility};
  }
  draw(){
    const c=this.camera(),s=this.s;this.world.draw(c,s,this.time);this.aircraft.draw(c,s,this.time);this.cockpit.draw(c,s,this.time,this.aircraft.ammo,c.alpha);
    if(this.tick++%5===0){
      byId('spd').textContent=Math.round(s.speed*1.94384).toString().padStart(3,'0');byId('alt').textContent=Math.round(s.y*3.28084).toLocaleString('en-US');this.sound.update(s);
    }
    const ammo=this.aircraft.ammo;if(this.tally!==ammo){this.tally=ammo;byId('count').textContent='0'+ammo;byId('payload').setAttribute('aria-label',inventoryName(ammo));document.querySelectorAll('.rail').forEach((el,i)=>el.classList.toggle('empty',i>=ammo))}
  }
  frame(ts){
    if(!this.paused&&!this.lost&&!document.hidden){
      const dt=this.last?Math.min(.18,(ts-this.last)/1000):0;this.buffer+=dt;
      while(this.buffer>=1/60){this.step(1/60);this.buffer-=1/60}
      this.draw();
      this.slow=Math.max(0,this.slow+(dt>.032?1:-.55));
      if(this.slow>55&&this.height>224){this.height=Math.max(224,this.height-38);this.slow=0;this.resize()}
    }
    this.last=ts;requestAnimationFrame(t=>this.frame(t));
  }
}
paintBadge();
let patrol;
bindSettings();setLanguage(language);
try{patrol=new Patrol()}catch(error){
  const warning=byId('failure'),needsGL=error.message.includes('WebGL 2 is required');
  warning.style.display='block';warning.dataset.zh=needsGL?'需要 WebGL 2。请开启浏览器的图形加速后重试。':'无法启动飞行画面。';
  warning.dataset.en=needsGL?error.message:'The flight display could not start.';
  warning.textContent=localText(warning.dataset.en,warning.dataset.zh);console.error(error);
}
